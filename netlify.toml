[build]
  publish = "public"
  functions = "netlify/functions"
  # OGP は絶対URLが必要なので、ビルド時に Netlify のサイトURL（URL）を埋め込む
  command = "sed -i \"s|__SITE_URL__|${URL}|g\" public/index.html"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

# 1日の上限を変えるページ
[[redirects]]
  from = "/up"
  to = "/up.html"
  status = 200

# 日ごとのクレジット使用量のページ
[[redirects]]
  from = "/credits"
  to = "/credits.html"
  status = 200
